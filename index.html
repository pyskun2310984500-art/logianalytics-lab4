<h1>LogiAnalytics</h1>
<p>Аналітична система для логістичної компанії.</p>
<h2>Про проєкт</h2>
<p>Система допомагає диспетчеру опрацьовувати заявки та призначати рейси, а керівнику відділу логістики — контролювати KPI і витрати автопарку.</p>
<h2>Модулі системи</h2>
<ul>
<li>Заявки</li>
<li>Рейси та моніторинг</li>
<li>Автопарк</li>
<li>Звіти</li>
</ul>
